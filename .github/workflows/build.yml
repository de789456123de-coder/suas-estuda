name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (gera projeto Android nativo)
        run: npx expo prebuild --platform android --no-install

      - name: Configurar JVM para projeto Android e plugin Expo
        run: |
          JVM_OPTS='org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
          KOTLIN_OPTS='kotlin.compiler.execution.strategy=in-process'

          # Projeto Android principal
          echo "$JVM_OPTS" >> android/gradle.properties
          echo "$KOTLIN_OPTS" >> android/gradle.properties

          # Included build do plugin Expo (onde o Kotlin falha)
          mkdir -p android/gradle-plugin
          echo "$JVM_OPTS" >> android/gradle-plugin/gradle.properties
          echo "$KOTLIN_OPTS" >> android/gradle-plugin/gradle.properties

      - name: Build APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --warning-mode none

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suas-estuda-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
