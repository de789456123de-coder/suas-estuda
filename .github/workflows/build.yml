name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (gera projeto Android nativo)
        run: npx expo prebuild --platform android --no-install

      - name: Debug - estrutura do plugin Expo
        run: |
          echo "=== android/settings.gradle ==="
          head -40 android/settings.gradle 2>/dev/null || head -40 android/settings.gradle.kts 2>/dev/null
          echo ""
          echo "=== gradle-plugin/build.gradle.kts ==="
          cat android/gradle-plugin/build.gradle.kts 2>/dev/null || echo "(nao encontrado)"
          echo ""
          echo "=== gradle-plugin/settings-plugin/build.gradle.kts ==="
          cat android/gradle-plugin/settings-plugin/build.gradle.kts 2>/dev/null || echo "(nao encontrado)"
          echo ""
          echo "=== Arquivos Kotlin gerados ==="
          find android/gradle-plugin -name "*.kt" 2>/dev/null | head -20

      - name: Configurar JVM para Android e plugin Expo
        run: |
          JVM='org.gradle.jvmargs=-Xmx4g -Xss4m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
          KT='kotlin.compiler.execution.strategy=in-process'
          echo "$JVM" >> android/gradle.properties
          echo "$KT" >> android/gradle.properties
          mkdir -p android/gradle-plugin
          echo "$JVM" >> android/gradle-plugin/gradle.properties
          echo "$KT" >> android/gradle-plugin/gradle.properties

      - name: Build APK debug
        env:
          KOTLIN_DAEMON_JVM_OPTIONS: "-Xmx2g -Xss4m -XX:MaxMetaspaceSize=512m"
        run: |
          cd android
          chmod +x gradlew
          echo "=== gradle-plugin/gradle.properties ==="
          cat gradle-plugin/gradle.properties 2>/dev/null || echo "(nao encontrado)"
          EXIT=0
          ./gradlew assembleDebug --warning-mode none --info > /tmp/gradle.log 2>&1 || EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "=== DETALHES DO ERRO ==="
            grep -A 20 "Caused by:\|Internal compiler error\|e: error:" /tmp/gradle.log | head -100 || true
            echo "=== ULTIMAS 60 LINHAS DO LOG ==="
            tail -60 /tmp/gradle.log
          fi
          exit $EXIT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suas-estuda-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
