name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (gera projeto Android nativo)
        run: npx expo prebuild --platform android --no-install

      - name: Configurar JVM e corrigir bug Kotlin FIR
        run: |
          JVM='org.gradle.jvmargs=-Xmx4g -Xss4m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
          KT='kotlin.compiler.execution.strategy=in-process'

          # Projeto Android principal
          echo "$JVM" >> android/gradle.properties
          echo "$KT"  >> android/gradle.properties

          # Included build do plugin Expo
          mkdir -p android/gradle-plugin
          echo "$JVM" >> android/gradle-plugin/gradle.properties
          echo "$KT"  >> android/gradle-plugin/gradle.properties

          # Corrigir bug FirIncompatibleClassExpressionChecker (Kotlin 2.x)
          # O compilador Kotlin crasha ao inspecionar tipos de JARs sem PSI source.
          # -Xskip-metadata-version-check suprime essa verificação.
          PATCH='tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach { kotlinOptions.freeCompilerArgs += listOf("-Xskip-metadata-version-check") }'
          for f in \
            android/gradle-plugin/settings-plugin/build.gradle.kts \
            android/gradle-plugin/build.gradle.kts; do
            if [ -f "$f" ]; then
              echo "" >> "$f"
              echo "$PATCH" >> "$f"
              echo "Patch aplicado: $f"
            fi
          done

          # Init script global (cobre qualquer build incluído não mapeado acima)
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/kotlin-fir-fix.gradle << 'EOF'
          allprojects {
              afterEvaluate {
                  project.tasks.matching { t ->
                      t.name.startsWith("compile") && t.name.endsWith("Kotlin")
                  }.configureEach { t ->
                      try {
                          t.kotlinOptions.freeCompilerArgs += ["-Xskip-metadata-version-check"]
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF

      - name: Build APK debug
        env:
          KOTLIN_DAEMON_JVM_OPTIONS: "-Xmx2g -Xss4m -XX:MaxMetaspaceSize=512m"
        run: |
          cd android
          chmod +x gradlew
          EXIT=0
          ./gradlew assembleDebug --warning-mode none > /tmp/gradle.log 2>&1 || EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "=== ERRO ==="
            grep -A 10 "Caused by:\|What went wrong:" /tmp/gradle.log | head -60 || true
          fi
          exit $EXIT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suas-estuda-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
